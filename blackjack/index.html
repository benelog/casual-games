<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="title">3D 블랙잭 · Casual Games</title>
    <meta name="theme-color" content="#0b0d12" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../icons/icon-192.png" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <script src="../shared/pwa.js" defer></script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/hahmlet@5.3.0/index.css" crossorigin />
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/game.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage"></div>

    <header class="top">
      <nav>
        <a class="back" href="../index.html" data-i18n="back">← 게임 목록</a>
      </nav>
      <span id="info"></span>
      <div class="controls" id="lang-controls"></div>
    </header>

    <div id="loading" data-i18n="loading">테이블을 준비하는 중…</div>
    <script>
      // file:// 로 열면 브라우저가 모듈 스크립트와 에셋 로딩을 막아 아래 main.js 가 실행되지 않는다
      if (location.protocol === 'file:') {
        const box = document.getElementById('loading');
        box.dataset.problem = '';
        box.textContent =
          '파일을 직접 열면 실행되지 않습니다. 저장소 루트에서 npm start 를 실행한 뒤 http://localhost:8000 으로 접속하세요. / ' +
          'This page does not work when opened as a file. Run npm start from the repository root and visit http://localhost:8000.';
      }
    </script>

    <footer class="bottom">
      <div id="banner" hidden>
        <strong id="banner-title"></strong>
        <span id="banner-detail"></span>
      </div>
      <div class="status">
        <span id="status"></span>
        <span id="my-hand"></span>
      </div>
      <div id="bet-controls" class="panel" hidden>
        <div class="chips">
          <button type="button" class="bet-chip" data-chip="10" data-shortcut="1" title="단축키 1">10</button>
          <button type="button" class="bet-chip" data-chip="50" data-shortcut="2" title="단축키 2">50</button>
          <button type="button" class="bet-chip" data-chip="100" data-shortcut="3" title="단축키 3">100</button>
          <button type="button" class="bet-chip" data-chip="500" data-shortcut="4" title="단축키 4">500</button>
        </div>
        <div class="actions">
          <button type="button" id="btn-clear" data-shortcut="Backspace" title="단축키 Backspace" data-i18n="clear">지우기</button>
          <button type="button" id="btn-deal" class="primary" data-shortcut="Enter" title="단축키 Enter" data-i18n="deal">딜</button>
        </div>
      </div>
      <div id="insurance-controls" class="panel" hidden>
        <div class="actions">
          <button type="button" id="btn-decline" data-shortcut="N" title="단축키 N" data-i18n="decline">거절</button>
          <button type="button" id="btn-insure" class="primary" data-shortcut="Y" title="단축키 Y" data-i18n="insure">보험 들기</button>
        </div>
      </div>
      <div id="controls" class="panel" hidden>
        <div class="actions">
          <button type="button" id="btn-hit" class="primary" data-shortcut="H" title="단축키 H" data-i18n="hit">히트</button>
          <button type="button" id="btn-stand" data-shortcut="S" title="단축키 S" data-i18n="stand">스탠드</button>
          <button type="button" id="btn-double" data-shortcut="D" title="단축키 D" data-i18n="double">더블</button>
          <button type="button" id="btn-split" data-shortcut="P" title="단축키 P" data-i18n="split">스플릿</button>
        </div>
      </div>
      <button type="button" id="btn-next" class="primary" hidden data-i18n="newGame">새 게임</button>
    </footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
