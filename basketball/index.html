<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title data-i18n="pageTitle">농구 자유투 · Casual Games</title>
    <meta name="theme-color" content="#0b0d12" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../icons/icon-192.png" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <script src="../shared/pwa.js" defer></script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/hahmlet@5.3.0/index.css" crossorigin />
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/game.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage" role="application" aria-label="농구 코트" data-i18n-aria-label="courtLabel"></div>

    <!-- 2인 대전: 화면 가장자리에 지금 차례인 사람의 색이 번진다 -->
    <div id="glow" hidden></div>

    <!-- 스와이프하는 동안 누른 곳에서 손가락까지 그리는 선 -->
    <svg id="swipe" aria-hidden="true" hidden>
      <line id="swipe-line" />
      <circle id="swipe-start" r="9" />
    </svg>

    <header class="top" id="top">
      <a class="back" href="../index.html" data-i18n="back">← 게임 목록</a>
      <div id="stats" hidden>
        <span class="stat"><small data-i18n="score">점수</small><b id="score">0</b></span>
        <span class="stat" id="stat-time"><small data-i18n="time">시간</small><b id="time">1:00</b></span>
        <span class="stat" id="stat-left"><small data-i18n="ballsLeft">남은 공</small><b id="left">0</b></span>
        <span class="stat"><small data-i18n="streak">연속</small><b id="streak">0</b></span>
      </div>
      <div id="versus" hidden>
        <div class="player" id="player-0" data-player="0">
          <span class="badge" data-i18n="yourTurn">차례</span>
          <span class="name"></span>
          <b class="score">0</b>
          <small class="balls"></small>
        </div>
        <div class="player" id="player-1" data-player="1">
          <span class="badge" data-i18n="yourTurn">차례</span>
          <span class="name"></span>
          <b class="score">0</b>
          <small class="balls"></small>
        </div>
      </div>
      <div class="controls" id="controls">
        <button type="button" class="chip" id="btn-menu" data-i18n="menu" data-i18n-title="menuTitle" hidden>메뉴</button>
        <button type="button" class="chip" id="btn-sound" aria-pressed="true" data-i18n="sound" data-i18n-title="soundTitle">소리</button>
      </div>
      <div class="controls" id="lang-controls"></div>
    </header>

    <p class="turn" id="turn" role="status" aria-live="polite" hidden><b id="turn-name"></b><span id="turn-hint"></span></p>

    <p class="spot" id="spot" hidden><span id="spot-name"></span><b id="spot-points"></b></p>

    <div id="loading" data-i18n="loading">코트를 닦는 중…</div>
    <script>
      // file:// 로 열면 브라우저가 모듈 스크립트와 에셋 로딩을 막아 아래 main.js 가 실행되지 않는다
      if (location.protocol === 'file:') {
        const box = document.getElementById('loading');
        box.dataset.problem = '';
        box.textContent =
          '파일을 직접 열면 실행되지 않습니다. 저장소 루트에서 npm start 를 실행한 뒤 http://localhost:8000 으로 접속하세요. ' +
          '/ This page does not run from a file. Run npm start in the repository root and open http://localhost:8000.';
      }
    </script>

    <div id="toast" role="status"></div>

    <footer class="bottom" id="bottom" hidden>
      <div id="power" aria-label="세기" data-i18n-aria-label="powerLabel" hidden>
        <div class="meter"><div id="power-fill"></div></div>
      </div>
      <div id="status"></div>
    </footer>

    <div id="menu" class="overlay" hidden>
      <div class="card">
        <h1 data-i18n="heading">농구 자유투</h1>
        <p class="lead" data-i18n="lead"></p>
        <fieldset>
          <legend data-i18n="mode">모드</legend>
          <div class="segmented" id="mode-options"></div>
        </fieldset>
        <p class="record" id="menu-record"></p>
        <button type="button" id="btn-start"><span data-i18n="start">시작</span> <kbd>Enter</kbd></button>
        <details class="help">
          <summary data-i18n="help">규칙 · 조작법</summary>
          <p data-i18n="helpRules"></p>
          <p data-i18n="helpBonus"></p>
          <p data-i18n="helpSpots"></p>
          <dl>
            <dt data-i18n="helpSwipeKey"></dt>
            <dd data-i18n="helpSwipe"></dd>
            <dt data-i18n="helpKeysKey"></dt>
            <dd data-i18n="helpKeys"></dd>
            <dt data-i18n="helpOtherKey"></dt>
            <dd data-i18n="helpOther"></dd>
          </dl>
        </details>
      </div>
    </div>

    <div id="result" class="overlay" hidden>
      <div class="card">
        <h1 id="result-title"></h1>
        <p id="result-detail"></p>
        <p class="record" id="result-record"></p>
        <button type="button" id="btn-again"><span data-i18n="again">한 판 더</span> <kbd>Enter</kbd></button>
        <button type="button" class="secondary" id="btn-result-menu" data-i18n="changeMode">모드 바꾸기</button>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
