<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="pageTitle">볼링 · Casual Games</title>
    <meta name="theme-color" content="#0b0d12" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../icons/icon-192.png" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <script src="../shared/pwa.js" defer></script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/hahmlet@5.3.0/index.css" crossorigin />
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/game.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
          "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage"></div>

    <header class="top">
      <a class="back" href="../index.html" data-i18n="back">← 게임 목록</a>
      <div class="tools" id="tools">
        <span class="title" data-i18n="title">볼링</span>
        <button type="button" class="chip" id="btn-sound" aria-pressed="true" data-i18n="sound" data-i18n-title="soundTitle">
          소리
        </button>
      </div>
    </header>

    <div id="loading" data-i18n="loading">레인에 핀을 세우는 중…</div>
    <script>
      // file:// 로 열면 브라우저가 모듈 스크립트와 에셋 로딩을 막아 아래 main.js 가 실행되지 않는다
      if (location.protocol === 'file:') {
        const box = document.getElementById('loading');
        box.dataset.problem = '';
        box.textContent =
          '파일을 직접 열면 실행되지 않습니다. 저장소 루트에서 npm start 를 실행한 뒤 http://localhost:8000 으로 접속하세요. ' +
          '/ This page does not run from a file. Run npm start in the repository root and open http://localhost:8000.';
      }
    </script>

    <aside id="hud" hidden>
      <table id="card">
        <thead>
          <tr id="card-head"></tr>
        </thead>
        <tbody id="card-body"></tbody>
      </table>
      <div id="pin-cam" aria-label="핀 덱" data-i18n-aria-label="pinDeck"></div>
    </aside>

    <div id="callout" hidden></div>

    <footer class="bottom">
      <div id="banner" hidden>
        <strong id="banner-title"></strong>
        <span id="banner-detail"></span>
      </div>
      <div id="controls" hidden>
        <div id="spin" role="radiogroup" aria-label="스핀" data-i18n-aria-label="spin">
          <button type="button" data-spin="-1" role="radio" data-i18n="hookLeft">↶ 왼쪽 훅</button>
          <button type="button" data-spin="0" role="radio" data-i18n="straight">직구</button>
          <button type="button" data-spin="1" role="radio" data-i18n="hookRight">오른쪽 훅 ↷</button>
        </div>
        <div id="power" hidden>
          <span data-i18n="soft">약</span>
          <div class="meter"><div id="power-fill"></div></div>
          <span data-i18n="hard">강</span>
        </div>
      </div>
      <div id="status"></div>
      <div id="menu" hidden>
        <strong id="menu-title" data-i18n="menuTitle">누구와 칠까요?</strong>
        <div class="modes">
          <button type="button" data-mode="computer">
            <span data-i18n="vsComputer">컴퓨터와 대전</span>
            <small data-i18n="vsComputerHint">혼자서 컴퓨터와 1:1</small>
          </button>
          <button type="button" data-mode="versus">
            <span data-i18n="versus">2인 대전</span>
            <small data-i18n="versusHint">한 기기로 번갈아 던지기</small>
          </button>
        </div>
      </div>
    </footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
