<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D 포커 · Casual Games</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage"></div>

    <header class="top">
      <nav>
        <a class="back" href="../index.html">← 게임 목록</a>
        <a class="back" id="change" href="index.html" hidden>종목 변경</a>
      </nav>
      <span id="info"></span>
    </header>

    <div id="loading">테이블을 준비하는 중…</div>
    <script>
      // file:// 로 열면 브라우저가 모듈 스크립트와 에셋 로딩을 막아 아래 main.js 가 실행되지 않는다
      if (location.protocol === 'file:') {
        document.getElementById('loading').textContent =
          '파일을 직접 열면 실행되지 않습니다. 저장소 루트에서 npm start 를 실행한 뒤 http://localhost:8000 으로 접속하세요.';
      }
    </script>

    <section id="menu" hidden>
      <h1>3D 포커</h1>
      <p>컴퓨터와 1:1로 겨룰 종목을 고르세요.</p>
      <div id="menu-list"></div>
    </section>

    <footer class="bottom">
      <div id="banner" hidden>
        <strong id="banner-title"></strong>
        <span id="banner-detail"></span>
      </div>
      <div class="status">
        <span id="status"></span>
        <span id="my-hand"></span>
      </div>
      <div id="controls" hidden>
        <div id="raise-row">
          <button type="button" data-preset="min">최소</button>
          <button type="button" data-preset="0.5">½ 팟</button>
          <button type="button" data-preset="1">팟</button>
          <button type="button" data-preset="max">올인</button>
          <input id="raise-slider" type="range" aria-label="베팅 금액" />
        </div>
        <div class="actions">
          <button type="button" id="btn-fold">폴드</button>
          <button type="button" id="btn-call">체크</button>
          <button type="button" id="btn-raise" class="primary">벳</button>
        </div>
      </div>
      <div id="draw-controls" hidden>
        <button type="button" id="btn-draw" class="primary">교환 없이 진행</button>
      </div>
      <button type="button" id="btn-next" class="primary" hidden>다음 핸드</button>
    </footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
