<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title data-i18n="pageTitle">컬링 · Casual Games</title>
    <meta name="theme-color" content="#0b0d12" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../icons/icon-192.png" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <script src="../shared/pwa.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage"></div>

    <header class="top" id="top">
      <a class="back" href="../index.html" data-i18n="back">← 게임 목록</a>
      <div class="controls" id="controls">
        <button type="button" class="chip" id="btn-menu" data-i18n="menu" data-i18n-title="menuTitle" hidden>메뉴</button>
        <button type="button" class="chip" id="btn-sound" aria-pressed="true" data-i18n="sound" data-i18n-title="soundTitle">소리</button>
      </div>
      <div class="controls" id="lang-controls"></div>
    </header>

    <div id="loading" data-i18n="loading">얼음판을 고르는 중…</div>
    <script>
      // file:// 로 열면 브라우저가 모듈 스크립트와 에셋 로딩을 막아 아래 main.js 가 실행되지 않는다
      if (location.protocol === 'file:') {
        document.getElementById('loading').textContent =
          '파일을 직접 열면 실행되지 않습니다. 저장소 루트에서 npm start 를 실행한 뒤 http://localhost:8000 으로 접속하세요. ' +
          '/ This page does not run from a file. Run npm start in the repository root and open http://localhost:8000.';
      }
    </script>

    <aside id="hud" hidden>
      <table id="board" aria-label="점수판" data-i18n-aria-label="boardLabel">
        <thead>
          <tr id="board-head"></tr>
        </thead>
        <tbody id="board-body"></tbody>
      </table>
      <div id="house-cam" role="img" aria-label="하우스를 위에서 본 모습" data-i18n-aria-label="houseLabel"></div>
    </aside>

    <div id="toast" role="status"></div>

    <footer class="bottom" id="bottom" hidden>
      <div id="aim-controls" hidden>
        <div id="spin" class="pills" role="group" aria-label="회전 방향" data-i18n-aria-label="spinLabel">
          <button type="button" data-spin="-1" aria-pressed="false" data-i18n="spinLeft">↶ 왼쪽 컬</button>
          <button type="button" data-spin="1" aria-pressed="true" data-i18n="spinRight">오른쪽 컬 ↷</button>
        </div>
        <div id="weight" aria-label="세기" data-i18n-aria-label="weightLabel" hidden>
          <div class="meter">
            <div id="meter-zones"></div>
            <div id="power-fill"></div>
          </div>
        </div>
        <div class="row">
          <button type="button" class="secondary" id="btn-back" data-i18n="aimAgain" hidden>← 조준</button>
          <button type="button" id="btn-next" data-i18n="next">세기 정하기 ▶</button>
        </div>
      </div>
      <button type="button" id="btn-sweep" data-i18n="sweep" data-i18n-title="sweepTitle" hidden>스위핑!</button>
      <div id="status"></div>
    </footer>

    <div id="menu" class="overlay" hidden>
      <div class="card">
        <h1 data-i18n="heading">컬링</h1>
        <p class="lead" data-i18n="lead"></p>
        <fieldset>
          <legend data-i18n="opponent">상대</legend>
          <div class="segmented" id="opponent-options"></div>
        </fieldset>
        <fieldset id="level-field">
          <legend data-i18n="level">컴퓨터 실력</legend>
          <div class="segmented" id="level-options"></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="ends">엔드 수</legend>
          <div class="segmented" id="end-options"></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="stones">팀당 스톤</legend>
          <div class="segmented" id="stone-options"></div>
        </fieldset>
        <p class="record" id="menu-record"></p>
        <button type="button" id="btn-start"><span data-i18n="start">시작</span> <kbd>Enter</kbd></button>
        <details class="help">
          <summary data-i18n="help">규칙 · 조작법</summary>
          <p data-i18n="helpRules"></p>
          <p data-i18n="helpHammer"></p>
          <p data-i18n="helpOut"></p>
          <dl>
            <dt data-i18n="helpAimKey"></dt>
            <dd data-i18n="helpAim"></dd>
            <dt data-i18n="helpSpinKey"></dt>
            <dd data-i18n="helpSpin"></dd>
            <dt data-i18n="helpThrowKey"></dt>
            <dd data-i18n="helpThrow"></dd>
            <dt data-i18n="helpSweepKey"></dt>
            <dd data-i18n="helpSweep"></dd>
            <dt data-i18n="helpOtherKey"></dt>
            <dd data-i18n="helpOther"></dd>
          </dl>
        </details>
      </div>
    </div>

    <div id="result" class="overlay" hidden>
      <div class="card">
        <h1 id="result-title"></h1>
        <p id="result-detail"></p>
        <p class="record" id="result-record"></p>
        <button type="button" id="btn-again"><span data-i18n="again">한 판 더</span> <kbd>Enter</kbd></button>
        <button type="button" class="secondary" id="btn-view" data-i18n="view">하우스 보기</button>
        <button type="button" class="secondary" id="btn-result-menu" data-i18n="changeSettings">설정 바꾸기</button>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
