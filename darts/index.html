<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title data-i18n="doc.title">다트 301 · Casual Games</title>
    <meta name="theme-color" content="#0b0d12" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../icons/icon-192.png" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <script src="../shared/pwa.js" defer></script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/hahmlet@5.3.0/index.css" crossorigin />
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/game.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage"></div>

    <header class="top">
      <a class="back" href="../index.html" data-i18n="back">← 게임 목록</a>
      <div class="actions" id="actions">
        <span class="title" data-i18n="title">다트 301</span>
        <button type="button" class="chip" id="btn-new" hidden data-i18n="newGame" data-i18n-title="newGame.title">새 게임</button>
        <button type="button" class="chip" id="btn-help" data-i18n="help" data-i18n-title="help.title" aria-haspopup="dialog">도움말</button>
        <button type="button" class="chip" id="btn-sound" aria-pressed="true" data-i18n="sound" data-i18n-title="sound.title">소리</button>
      </div>
    </header>

    <div id="loading" data-i18n="loading">다트보드를 거는 중…</div>
    <script>
      // file:// 로 열면 브라우저가 모듈 스크립트와 에셋 로딩을 막아 아래 main.js 가 실행되지 않는다
      if (location.protocol === 'file:') {
        const box = document.getElementById('loading');
        box.dataset.problem = '';
        box.textContent =
          '파일을 직접 열면 실행되지 않습니다. 저장소 루트에서 npm start 를 실행한 뒤 http://localhost:8000 으로 접속하세요. ' +
          '/ Opening the file directly does not work. Run npm start in the repository root and visit http://localhost:8000.';
      }
    </script>

    <aside id="hud" hidden data-i18n-aria-label="hud.aria" aria-label="점수판">
      <div class="player" id="player-0">
        <span class="name"><i class="dot me"></i><span id="name-0">나</span></span>
        <strong id="score-0">301</strong>
      </div>
      <div class="player" id="player-1">
        <span class="name"><i class="dot computer"></i><span id="name-1">컴퓨터</span></span>
        <strong id="score-1">301</strong>
      </div>
      <div class="turn">
        <div id="darts"><span></span><span></span><span></span></div>
        <span class="total"><span data-i18n="turn.total">이번 턴</span> <b id="turn-total">0</b></span>
      </div>
    </aside>

    <footer class="bottom">
      <div id="banner" hidden>
        <strong id="banner-title"></strong>
        <span id="banner-detail"></span>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
      <div id="modes" role="group" hidden data-i18n-aria-label="mode.aria" aria-label="대전 방식">
        <button type="button" data-mode="computer" data-i18n="mode.computer">컴퓨터와 대전</button>
        <button type="button" class="ghost" data-mode="versus" data-i18n="mode.versus" data-i18n-title="mode.versus.title">2인 대전</button>
      </div>
    </footer>

    <div id="help" class="overlay" role="dialog" aria-modal="true" aria-labelledby="help-title" hidden>
      <div class="card">
        <h1 id="help-title" data-i18n="help.heading">다트 301</h1>
        <p class="lead" data-i18n="help.rules">301점에서 시작해 한 턴에 다트 3개를 던지고, 남은 점수를 정확히 0으로 만들면 이깁니다. 남은 점수보다 많이 맞히면 버스트로 그 턴의 점수가 무효가 됩니다.</p>
        <div class="help">
          <dl>
            <dt data-i18n="help.throwKey">클릭 · 탭</dt>
            <dd data-i18n="help.throw">흔들리는 조준점이 원하는 구역에 왔을 때 던지기 (터치는 누른 채 움직이다 손을 뗄 때)</dd>
            <dt><kbd>N</kbd></dt>
            <dd data-i18n="help.new">새 게임 (진행 중인 판을 그만두고 대전 방식 고르기)</dd>
            <dt><kbd>M</kbd> · <kbd>?</kbd></dt>
            <dd data-i18n="help.other">소리 · 이 도움말</dd>
          </dl>
        </div>
        <button type="button" id="btn-help-close"><span data-i18n="close">닫기</span> <kbd>Esc</kbd></button>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
