<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>메모리 카드 · Casual Games</title>
    <meta name="theme-color" content="#0a0e14" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../icons/icon-192.png" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <script src="../shared/pwa.js" defer></script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/hahmlet@5.3.0/index.css" crossorigin />
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/game.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage" tabindex="0" role="application" aria-label="카드 판" data-i18n-aria-label="boardLabel"></div>

    <!-- 2인 대전: 화면 가장자리에 지금 차례인 사람의 색이 번진다 -->
    <div id="glow" hidden></div>

    <header class="top" id="top">
      <a class="back" href="../index.html" data-i18n="back">← 게임 목록</a>
      <div id="stats" hidden>
        <span class="stat"><small data-i18n="turns">턴</small><b id="turns">0</b></span>
        <span class="stat time"><small data-i18n="time">시간</small><b id="time">0:00</b></span>
        <span class="stat"><small data-i18n="pairs">짝</small><b id="found">0/0</b></span>
      </div>
      <div id="versus" hidden>
        <div class="player" id="player-0" data-player="0">
          <span class="badge" data-i18n="yourTurn">차례</span>
          <span class="name"></span>
          <b class="score">0</b>
        </div>
        <div class="player" id="player-1" data-player="1">
          <span class="badge" data-i18n="yourTurn">차례</span>
          <span class="name"></span>
          <b class="score">0</b>
        </div>
      </div>
      <div class="controls" id="controls">
        <button type="button" class="chip" id="btn-sound" title="소리 (M)" data-i18n-title="soundTitle" aria-pressed="true" data-i18n="sound">소리</button>
      </div>
      <div class="controls" id="lang-controls"></div>
    </header>

    <p class="turn" id="turn" role="status" aria-live="polite" hidden><b id="turn-name"></b><span id="turn-hint"></span></p>

    <div id="loading" data-i18n="loading">카드를 섞는 중…</div>
    <script>
      // file:// 로 열면 브라우저가 모듈 스크립트 로딩을 막아 아래 main.js 가 실행되지 않는다
      if (location.protocol === 'file:') {
        const box = document.getElementById('loading');
        box.dataset.problem = '';
        box.textContent =
          '파일을 직접 열면 실행되지 않습니다. 저장소 루트에서 npm start 를 실행한 뒤 http://localhost:8000 으로 접속하세요. / ' +
          'Opening the file directly does not work. Run npm start in the repository root and visit http://localhost:8000.';
      }
    </script>

    <div id="menu" class="overlay" hidden>
      <div class="card">
        <h1 data-i18n="heading">메모리 카드</h1>
        <p class="lead" data-i18n="lead">카드를 두 장씩 뒤집어 같은 동물끼리 짝을 맞추세요. 틀리면 다시 덮이니 자리를 기억해 두세요.</p>
        <fieldset>
          <legend data-i18n="players">인원</legend>
          <div class="segmented" id="player-options"></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="size">카드 수</legend>
          <div class="segmented" id="size-options"></div>
        </fieldset>
        <p class="best" id="menu-best"></p>
        <button type="button" id="btn-start"><span data-i18n="start">시작</span> <kbd>Enter</kbd></button>
        <details class="help">
          <summary data-i18n="help">규칙 · 조작법</summary>
          <p data-i18n="helpSolo"></p>
          <p data-i18n="helpVersus"></p>
          <dl>
            <dt data-i18n="helpTapKey">탭 · 클릭</dt>
            <dd data-i18n="helpTap">카드 뒤집기</dd>
            <dt data-i18n="helpKeysKey">방향키 · Space</dt>
            <dd data-i18n="helpKeys">카드 고르기 · 뒤집기</dd>
            <dt data-i18n="helpOtherKey">R · M · Esc</dt>
            <dd data-i18n="helpOther">새 판 · 소리 · 메뉴</dd>
          </dl>
        </details>
      </div>
    </div>

    <div id="result" class="overlay" hidden>
      <div class="card">
        <h1 id="result-title"></h1>
        <p id="result-detail"></p>
        <p class="best" id="result-best"></p>
        <button type="button" id="btn-next"><span data-i18n="again">한 판 더</span> <kbd>Enter</kbd></button>
        <button type="button" class="secondary" id="btn-view" data-i18n="view">판 보기</button>
        <button type="button" class="secondary" id="btn-result-menu" data-i18n="changeSettings">인원·카드 수 바꾸기</button>
      </div>
    </div>

    <footer class="bar" id="bar" hidden>
      <button type="button" class="secondary" id="btn-restart" title="카드를 다시 섞어 처음부터 (R)" data-i18n-title="restartTitle" data-i18n="restart">새 판</button>
      <button type="button" class="secondary" id="btn-menu" title="인원·카드 수 바꾸기 (Esc)" data-i18n-title="menuTitle" data-i18n="menu">메뉴</button>
    </footer>

    <div id="toast" role="status"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
