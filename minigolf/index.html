<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title data-i18n="pageTitle">미니 골프 · Casual Games</title>
    <meta name="theme-color" content="#0b0d12" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../icons/icon-192.png" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <script src="../shared/pwa.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage" tabindex="0" role="application" aria-label="미니 골프 코스" data-i18n-aria-label="courseLabel"></div>

    <!-- 지금 차례인 사람의 색이 화면 가장자리에 번진다 (여럿이 할 때) -->
    <div id="glow" hidden></div>

    <header class="top" id="top">
      <a class="back" href="../index.html" data-i18n="back">← 게임 목록</a>
      <div id="hud" hidden>
        <div class="stat" id="hole-stat">
          <b id="hole-label"></b>
          <span id="par-label"></span>
        </div>
        <div class="stat" id="stroke-stat">
          <span class="label" data-i18n="strokes">타수</span>
          <b id="stroke-count">0</b>
          <span id="stroke-max"></span>
        </div>
        <div class="stat" id="total-stat">
          <span class="label" data-i18n="total">합계</span>
          <b id="total-label"></b>
        </div>
      </div>
      <div class="controls" id="controls" hidden>
        <button type="button" class="chip" id="btn-camera" title="시점 바꾸기 (C)" data-i18n-title="cameraTitle"></button>
        <button type="button" class="chip" id="btn-card" title="스코어카드 (S)" data-i18n-title="cardTitle" data-i18n="card">스코어카드</button>
        <button type="button" class="chip" id="btn-sound" title="소리 켜기/끄기 (M)" data-i18n-title="soundTitle" aria-pressed="true" data-i18n="sound">소리</button>
        <button type="button" class="chip" id="btn-menu" title="새 게임·설정 (Esc)" data-i18n-title="menuTitle" data-i18n="menu">메뉴</button>
      </div>
      <div class="controls" id="lang-controls"></div>
    </header>

    <p class="turn" id="turn" role="status" aria-live="polite" hidden><b id="turn-name"></b><span id="turn-hint"></span></p>

    <footer class="bar" id="bar" hidden>
      <div class="power" id="power" role="meter" aria-label="세기" data-i18n-aria-label="power" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="label" data-i18n="power">세기</span>
        <div class="track"><div class="fill" id="power-fill"></div></div>
      </div>
    </footer>

    <div id="loading" data-i18n="loading">코스를 까는 중…</div>
    <script>
      // file:// 로 열면 브라우저가 모듈 스크립트와 에셋 로딩을 막아 아래 main.js 가 실행되지 않는다
      if (location.protocol === 'file:') {
        document.getElementById('loading').textContent =
          '파일을 직접 열면 실행되지 않습니다. 저장소 루트에서 npm start 를 실행한 뒤 http://localhost:8000 으로 접속하세요. / ' +
          'Opening the file directly does not work. Run npm start in the repository root and visit http://localhost:8000.';
      }
    </script>

    <div id="menu" class="overlay" hidden>
      <div class="card">
        <h1 data-i18n="heading">미니 골프</h1>
        <p class="lead" data-i18n="lead"></p>
        <fieldset>
          <legend data-i18n="players">인원</legend>
          <div class="segmented" id="player-options"></div>
        </fieldset>
        <p class="record" id="menu-record"></p>
        <button type="button" id="btn-start"><span data-i18n="start">시작</span> <kbd>Enter</kbd></button>
        <details class="help">
          <summary data-i18n="help">규칙 · 조작법</summary>
          <p data-i18n="helpRules"></p>
          <p data-i18n="helpHazards"></p>
          <dl>
            <dt data-i18n="helpDragKey"></dt>
            <dd data-i18n="helpDrag"></dd>
            <dt data-i18n="helpKeysKey"></dt>
            <dd data-i18n="helpKeys"></dd>
            <dt data-i18n="helpOtherKey"></dt>
            <dd data-i18n="helpOther"></dd>
          </dl>
        </details>
      </div>
    </div>

    <!-- 홀을 마칠 때마다, 또는 스코어카드 버튼으로 여는 점수표 -->
    <div id="scorecard" class="overlay" hidden>
      <div class="card wide">
        <h1 id="card-title"></h1>
        <p id="card-detail"></p>
        <div class="table-wrap"><table class="score-table" id="card-table"></table></div>
        <p class="legend" id="card-legend"></p>
        <button type="button" id="btn-next"><span id="btn-next-label"></span> <kbd>Enter</kbd></button>
        <button type="button" class="secondary" id="btn-card-close" data-i18n="close">닫기</button>
      </div>
    </div>

    <div id="result" class="overlay" hidden>
      <div class="card wide">
        <h1 id="result-title"></h1>
        <p id="result-detail"></p>
        <p class="record" id="result-record"></p>
        <div class="table-wrap"><table class="score-table" id="result-table"></table></div>
        <button type="button" id="btn-again"><span data-i18n="again">한 번 더</span> <kbd>Enter</kbd></button>
        <button type="button" class="secondary" id="btn-view" data-i18n="view">코스 보기</button>
        <button type="button" class="secondary" id="btn-result-menu" data-i18n="changeSettings">설정 바꾸기</button>
      </div>
    </div>

    <div id="toast" role="status"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
