<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Casual Games</title>
    <meta name="theme-color" content="#0b0d12" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <script src="shared/pwa.js" defer></script>
    <style>
      :root {
        --ink: #f3ecdc;
        --muted: #b9b09c;
        --brass: #d9b46a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 64px 20px;
        background: radial-gradient(circle at 50% 0%, #1b2a24, #0b0d12 60%);
        color: var(--ink);
        font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      }
      main {
        position: relative;
        max-width: 880px;
        margin: 0 auto;
      }
      .lang-toggle {
        position: absolute;
        top: -44px;
        right: 0;
        padding: 6px 14px;
        border: 1px solid rgba(243, 236, 220, 0.24);
        border-radius: 999px;
        background: rgba(243, 236, 220, 0.06);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .lang-toggle:hover,
      .lang-toggle:focus-visible {
        border-color: var(--brass);
        outline: none;
      }
      h1 {
        margin: 0 0 6px;
        font-family: Georgia, 'Noto Serif KR', serif;
        font-size: 40px;
        font-weight: 400;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin: 28px 0 0;
      }
      .tabs button {
        padding: 8px 18px;
        border: 1px solid rgba(243, 236, 220, 0.24);
        border-radius: 999px;
        background: rgba(243, 236, 220, 0.06);
        color: var(--muted);
        font: inherit;
        font-size: 15px;
        cursor: pointer;
      }
      .tabs button:hover,
      .tabs button:focus-visible {
        border-color: var(--brass);
        outline: none;
      }
      .tabs button[aria-selected='true'] {
        border-color: var(--brass);
        background: rgba(217, 180, 106, 0.16);
        color: var(--ink);
      }
      .games {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 18px;
        margin: 20px 0 0;
        padding: 0;
        list-style: none;
      }
      .games a {
        display: block;
        height: 100%;
        border: 1px solid rgba(243, 236, 220, 0.16);
        border-radius: 16px;
        overflow: hidden;
        background: rgba(243, 236, 220, 0.04);
        color: inherit;
        text-decoration: none;
        transition: border-color 0.15s, transform 0.15s;
      }
      .games a:hover,
      .games a:focus-visible {
        border-color: var(--brass);
        transform: translateY(-3px);
        outline: none;
      }
      .art {
        display: grid;
        place-items: center;
        height: 150px;
        font-size: 64px;
      }
      .text {
        padding: 16px 18px 20px;
      }
      h2 {
        margin: 0 0 6px;
        font-size: 19px;
      }
      .text p {
        font-size: 14px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Casual Games</h1>
      <p data-i18n="tagline">가볍게 즐기는 게임 모음</p>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-solo" data-tab="solo" aria-controls="games" data-i18n="tabSolo">혼자서</button>
        <button type="button" role="tab" id="tab-multi" data-tab="multi" aria-controls="games" data-i18n="tabMulti">여럿이</button>
      </div>
      <ul class="games" id="games" role="tabpanel"></ul>
    </main>
    <script type="module">
      import { lang, createT, applyI18n, mountLangToggle } from './shared/i18n.js';

      // 새 게임은 디렉토리를 만들고 여기에 한 줄 추가한다.
      // modes: 'solo' 는 혼자서(컴퓨터와 1:1 포함), 'multi' 는 여러 사람이 할 수 있는 게임. 둘 다면 두 탭에 모두 나온다
      const games = [
        {
          path: 'poker/index.html',
          modes: ['solo'],
          title: { ko: '3D 포커', en: '3D Poker' },
          description: {
            ko: '컴퓨터와 1:1로 겨루는 텍사스 홀덤 · 오마하 · 파이브 카드 드로우 · 세븐 카드 스터드',
            en: "Heads-up against the computer: Texas Hold'em · Omaha · Five-Card Draw · Seven-Card Stud",
          },
          art: '♠',
          background: 'radial-gradient(circle at 50% 40%, #1f8a55, #0b4a2c)',
        },
        {
          path: 'darts/index.html',
          modes: ['solo', 'multi'],
          title: { ko: '다트 301', en: 'Darts 301' },
          description: {
            ko: '흔들리는 조준점을 맞춰 던지는 3D 다트. 컴퓨터나 친구보다 먼저 301점을 0으로',
            en: 'Time your throw against a wobbling aim. Bring 301 down to zero before the computer or a friend',
          },
          art: '🎯',
          background: 'radial-gradient(circle at 50% 40%, #8a4a2a, #3a1c10)',
        },
        {
          path: 'bowling/index.html',
          modes: ['solo', 'multi'],
          title: { ko: '볼링', en: 'Bowling' },
          description: {
            ko: '위치·방향·세기를 맞춰 굴리는 3D 텐핀 볼링. 컴퓨터나 친구와 10프레임 승부',
            en: 'Line up position, direction and power in 3D ten-pin bowling. Ten frames against the computer or a friend',
          },
          art: '🎳',
          background: 'radial-gradient(circle at 50% 40%, #b07a3a, #4a2c12)',
        },
        {
          path: 'blackjack/index.html',
          modes: ['solo'],
          title: { ko: '3D 블랙잭', en: '3D Blackjack' },
          description: {
            ko: '6덱 슈로 딜러와 겨루는 블랙잭. 히트 · 스탠드 · 더블 · 스플릿 · 인슈어런스, 블랙잭 3:2',
            en: 'Beat the dealer from a six-deck shoe. Hit · Stand · Double · Split · Insurance, blackjack pays 3:2',
          },
          art: '🂡',
          background: 'radial-gradient(circle at 50% 40%, #1f6f8a, #0b3a4a)',
        },
        {
          path: 'defense/index.html',
          modes: ['solo'],
          title: { ko: '타워 디펜스', en: 'Tower Defense' },
          description: {
            ko: '길목에 궁수탑·대포·빙결탑을 세워 20웨이브의 UFO 침공을 막아내는 3D 타워 디펜스',
            en: 'Build archer, cannon and frost towers along the path to hold off 20 waves of UFOs',
          },
          art: '🏰',
          background: 'radial-gradient(circle at 50% 40%, #3f8a5a, #16402a)',
        },
        {
          path: 'blocks3d/index.html',
          modes: ['solo'],
          title: { ko: '3D 블록', en: '3D Blocks' },
          description: {
            ko: '입체 조각을 세 축으로 돌려 우물 바닥을 채우는 3D 블록 퍼즐. 한 층이 꽉 차면 사라진다',
            en: '3D block puzzle: rotate pieces on three axes to fill the pit. Complete layers vanish',
          },
          art: '🧊',
          background: 'radial-gradient(circle at 50% 40%, #4a5fb0, #1c2350)',
        },
        {
          path: 'archery/index.html',
          modes: ['solo', 'multi'],
          title: { ko: '양궁', en: 'Archery' },
          description: {
            ko: '바람을 읽고 70m 과녁을 노리는 리커브 양궁. 컴퓨터와 8강·4강·결승을 이겨 금메달, 또는 친구와 1:1',
            en: 'Read the wind and shoot at 70 m. Beat the computer from the quarterfinal to the final for gold, or face a friend',
          },
          art: '🏹',
          background: 'radial-gradient(circle at 50% 40%, #2f7fb8, #10324d)',
        },
        {
          path: 'sokoban/index.html',
          modes: ['solo'],
          title: { ko: '3D 소코반', en: '3D Sokoban' },
          description: {
            ko: '창고의 상자를 밀어 모두 목표 칸에 넣는 상자 밀기 퍼즐. 되돌리기와 최소 이동 기록',
            en: 'Push every crate onto its goal in a 3D warehouse. Undo freely and chase the fewest moves',
          },
          art: '📦',
          background: 'radial-gradient(circle at 50% 40%, #a8743a, #3d2812)',
        },
        {
          path: 'pipes/index.html',
          modes: ['solo'],
          title: { ko: '파이프 연결', en: 'Pipes' },
          description: {
            ko: '파이프 조각을 돌려 수원에서 모든 칸까지 물길을 잇는 퍼즐. 매번 새 퍼즐과 오늘의 퍼즐',
            en: 'Rotate pipe pieces until water reaches every tile. Endless new puzzles plus a daily one',
          },
          art: '🚰',
          background: 'radial-gradient(circle at 50% 40%, #2a9aa8, #0e3d48)',
        },
        {
          path: 'fruitpop/index.html',
          modes: ['solo', 'multi'],
          title: { ko: '과일 팡팡', en: 'Fruit Pop' },
          description: {
            ko: '같은 과일 4개를 이어 터뜨리는 대전 퍼즐. 연쇄로 코코넛을 보내 컴퓨터나 친구의 판을 먼저 채운다',
            en: 'Versus puzzle: connect four of a fruit to pop them and chain pops to bury the computer or a friend in coconuts',
          },
          art: '🍎',
          background: 'radial-gradient(circle at 50% 40%, #c8553f, #4a1a1c)',
        },
      ];

      const t = createT({
        ko: { tagline: '가볍게 즐기는 게임 모음', tabSolo: '혼자서', tabMulti: '여럿이' },
        en: { tagline: 'Quick games to play right in your browser', tabSolo: 'Solo', tabMulti: 'Multiplayer' },
      });
      const pick = (text) => text[lang] ?? text.ko;

      applyI18n(t);
      mountLangToggle(document.querySelector('main'));

      const list = document.getElementById('games');
      const tabs = [...document.querySelectorAll('.tabs button')];
      const TAB_KEY = 'casual-games:tab';

      function createCard(game) {
        const item = document.createElement('li');
        const link = document.createElement('a');
        link.href = game.path;
        const art = document.createElement('div');
        art.className = 'art';
        art.style.background = game.background;
        art.textContent = game.art;
        const text = document.createElement('div');
        text.className = 'text';
        const title = document.createElement('h2');
        title.textContent = pick(game.title);
        const description = document.createElement('p');
        description.textContent = pick(game.description);
        text.append(title, description);
        link.append(art, text);
        item.append(link);
        return item;
      }

      function showTab(mode) {
        for (const tab of tabs) tab.setAttribute('aria-selected', String(tab.dataset.tab === mode));
        list.setAttribute('aria-labelledby', `tab-${mode}`);
        list.replaceChildren(...games.filter((game) => game.modes.includes(mode)).map(createCard));
      }

      for (const tab of tabs) {
        tab.addEventListener('click', () => {
          showTab(tab.dataset.tab);
          try {
            localStorage.setItem(TAB_KEY, tab.dataset.tab);
          } catch {
            // 저장이 막혀 있어도 탭은 바뀐다
          }
        });
      }

      let saved = null;
      try {
        saved = localStorage.getItem(TAB_KEY);
      } catch {
        // 저장소를 못 읽으면 첫 탭
      }
      showTab(saved === 'multi' ? 'multi' : 'solo');
    </script>
  </body>
</html>
