# 빌드 없이 저장소 루트를 그대로 배포한다
[build]
  publish = "."
  command = ""

# 서비스 워커와 manifest 는 항상 새로 받게 해 배포가 바로 반영되게 한다
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
