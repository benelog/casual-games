<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>윷놀이 · Casual Games</title>
    <meta name="theme-color" content="#0c0a08" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../icons/icon-192.png" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <script src="../shared/pwa.js" defer></script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/hahmlet@5.3.0/index.css" crossorigin />
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/game.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage" tabindex="0" role="application" aria-label="윷판" data-i18n-aria-label="boardLabel"></div>

    <!-- 지금 차례인 편의 색이 화면 가장자리에 번진다 -->
    <div id="glow" hidden></div>

    <header class="top" id="top">
      <a class="back" href="../index.html" data-i18n="back">← 게임 목록</a>
      <div id="teams" hidden></div>
      <div class="controls" id="controls" hidden>
        <button type="button" class="chip" id="btn-sound" title="소리 (M)" data-i18n-title="soundTitle" aria-pressed="true" data-i18n="sound">소리</button>
        <button type="button" class="chip" id="btn-menu" title="인원·규칙 바꾸기 (Esc)" data-i18n-title="menuTitle" data-i18n="menu">메뉴</button>
      </div>
      <div class="controls" id="lang-controls"></div>
    </header>

    <p class="turn" id="turn" role="status" aria-live="polite" hidden><b id="turn-name"></b><span id="turn-hint"></span></p>

    <footer class="dock" id="dock" hidden>
      <div class="results" id="results" role="group"></div>
      <button type="button" id="btn-throw" title="윷 던지기 (Space)" data-i18n-title="throwTitle"><span data-i18n="throw">윷 던지기</span> <kbd>Space</kbd></button>
    </footer>

    <div id="loading" data-i18n="loading">윷판을 펴는 중…</div>
    <script>
      // file:// 로 열면 브라우저가 모듈 스크립트 로딩을 막아 아래 main.js 가 실행되지 않는다
      if (location.protocol === 'file:') {
        const box = document.getElementById('loading');
        box.dataset.problem = '';
        box.textContent =
          '파일을 직접 열면 실행되지 않습니다. 저장소 루트에서 npm start 를 실행한 뒤 http://localhost:8000 으로 접속하세요. / ' +
          'Opening the file directly does not work. Run npm start in the repository root and visit http://localhost:8000.';
      }
    </script>

    <div id="menu" class="overlay" hidden>
      <div class="card">
        <h1 data-i18n="heading">윷놀이</h1>
        <p class="lead" data-i18n="lead"></p>
        <fieldset>
          <legend data-i18n="players">인원</legend>
          <div class="segmented" id="player-options"></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="seats">편 구성</legend>
          <div class="seats" id="seat-options"></div>
        </fieldset>
        <fieldset id="level-field">
          <legend data-i18n="level">컴퓨터 실력</legend>
          <div class="segmented" id="level-options"></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="backdoRule">빽도</legend>
          <div class="segmented" id="backdo-options"></div>
        </fieldset>
        <p class="best" id="menu-record"></p>
        <button type="button" id="btn-start"><span data-i18n="start">시작</span> <kbd>Enter</kbd></button>
        <details class="help">
          <summary data-i18n="help">규칙 · 조작법</summary>
          <p data-i18n="helpResults"></p>
          <p data-i18n="helpTurn"></p>
          <p data-i18n="helpCapture"></p>
          <p data-i18n="helpShortcut"></p>
          <p data-i18n="helpEnd"></p>
          <dl>
            <dt data-i18n="helpTapKey">탭 · 클릭</dt>
            <dd data-i18n="helpTap"></dd>
            <dt data-i18n="helpKeysKey"></dt>
            <dd data-i18n="helpKeys"></dd>
            <dt data-i18n="helpOtherKey">M · Esc</dt>
            <dd data-i18n="helpOther">소리 · 메뉴</dd>
          </dl>
        </details>
      </div>
    </div>

    <div id="result" class="overlay" hidden>
      <div class="card">
        <h1 id="result-title"></h1>
        <p id="result-detail"></p>
        <p class="best" id="result-record"></p>
        <button type="button" id="btn-next"><span data-i18n="again">한 판 더</span> <kbd>Enter</kbd></button>
        <button type="button" class="secondary" id="btn-view" data-i18n="view">판 보기</button>
        <button type="button" class="secondary" id="btn-result-menu" data-i18n="changeSettings">인원·규칙 바꾸기</button>
      </div>
    </div>

    <div id="toast" role="status"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
