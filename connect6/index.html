<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title data-i18n="pageTitle">육목 · Casual Games</title>
    <meta name="theme-color" content="#0b0d12" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../icons/icon-192.png" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <script src="../shared/pwa.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage" tabindex="0" role="application" aria-label="바둑판" data-i18n-aria-label="boardLabel"></div>

    <!-- 지금 차례인 사람의 색이 화면 가장자리에 번진다 -->
    <div id="glow" hidden></div>

    <header class="top" id="top">
      <a class="back" href="../index.html" data-i18n="back">← 게임 목록</a>
      <div id="versus" hidden>
        <div class="player" id="player-0" data-player="0">
          <i class="stone black"></i>
          <span class="name"></span>
          <b class="count" title="판 위의 돌" data-i18n-title="stonesOnBoard">0</b>
        </div>
        <div class="player" id="player-1" data-player="1">
          <i class="stone white"></i>
          <span class="name"></span>
          <b class="count" title="판 위의 돌" data-i18n-title="stonesOnBoard">0</b>
        </div>
      </div>
      <div class="controls" id="controls" hidden>
        <button type="button" class="chip" id="btn-undo" title="한 차례 무르기 (U)" data-i18n-title="undoTitle" data-i18n="undo">무르기</button>
        <button type="button" class="chip" id="btn-new" title="처음부터 다시 (N)" data-i18n-title="newGameTitle" data-i18n="newGame">새 판</button>
        <button type="button" class="chip" id="btn-sound" title="소리 켜기/끄기 (M)" data-i18n-title="soundTitle" aria-pressed="true" data-i18n="sound">소리</button>
        <button type="button" class="chip" id="btn-menu" title="설정 바꾸기 (Esc)" data-i18n-title="menuTitle" data-i18n="menu">메뉴</button>
      </div>
      <div class="controls" id="lang-controls"></div>
    </header>

    <p class="turn" id="turn" role="status" aria-live="polite" hidden>
      <b id="turn-name"></b>
      <span class="left" id="turn-left" title="이번 차례에 더 둘 돌" data-i18n-title="leftTitle"><span class="pips" id="turn-pips"></span><span id="turn-count"></span></span>
      <span class="hint" id="turn-hint"></span>
    </p>

    <footer class="bar" id="bar" hidden>
      <div class="confirm" id="confirm" hidden>
        <button type="button" id="btn-place" data-i18n="place">여기에 두기</button>
        <button type="button" class="secondary" id="btn-cancel" data-i18n="cancel">취소</button>
      </div>
      <div class="view-controls">
        <button type="button" class="chip round" id="btn-zoom-out" title="축소 (−)" data-i18n-title="zoomOut" aria-label="축소" data-i18n-aria-label="zoomOut">−</button>
        <button type="button" class="chip round" id="btn-zoom-in" title="확대 (+)" data-i18n-title="zoomIn" aria-label="확대" data-i18n-aria-label="zoomIn">+</button>
        <button type="button" class="chip" id="btn-view" title="비스듬히 보기 / 위에서 보기 (V)" data-i18n-title="viewTitle" data-i18n="view">시점</button>
      </div>
    </footer>

    <div id="loading" data-i18n="loading">바둑판을 펴는 중…</div>
    <script>
      // file:// 로 열면 브라우저가 모듈 스크립트와 에셋 로딩을 막아 아래 main.js 가 실행되지 않는다
      if (location.protocol === 'file:') {
        document.getElementById('loading').textContent =
          '파일을 직접 열면 실행되지 않습니다. 저장소 루트에서 npm start 를 실행한 뒤 http://localhost:8000 으로 접속하세요. / ' +
          'Opening the file directly does not work. Run npm start in the repository root and visit http://localhost:8000.';
      }
    </script>

    <div id="menu" class="overlay" hidden>
      <div class="card">
        <h1 data-i18n="heading">육목</h1>
        <p class="lead" data-i18n="lead"></p>
        <fieldset>
          <legend data-i18n="opponent">상대</legend>
          <div class="segmented" id="opponent-options"></div>
        </fieldset>
        <fieldset id="level-field">
          <legend data-i18n="level">컴퓨터 실력</legend>
          <div class="segmented" id="level-options"></div>
        </fieldset>
        <fieldset id="color-field">
          <legend data-i18n="color">내 돌</legend>
          <div class="segmented" id="color-options"></div>
        </fieldset>
        <p class="record" id="menu-record"></p>
        <button type="button" id="btn-start"><span data-i18n="start">시작</span> <kbd>Enter</kbd></button>
        <details class="help">
          <summary data-i18n="help">규칙 · 조작법</summary>
          <p data-i18n="helpRules"></p>
          <p data-i18n="helpTip"></p>
          <dl>
            <dt data-i18n="helpTapKey"></dt>
            <dd data-i18n="helpTap"></dd>
            <dt data-i18n="helpZoomKey"></dt>
            <dd data-i18n="helpZoom"></dd>
            <dt data-i18n="helpKeysKey"></dt>
            <dd data-i18n="helpKeys"></dd>
            <dt data-i18n="helpOtherKey"></dt>
            <dd data-i18n="helpOther"></dd>
          </dl>
        </details>
      </div>
    </div>

    <div id="result" class="overlay" hidden>
      <div class="card">
        <h1 id="result-title"></h1>
        <p id="result-detail"></p>
        <p class="record" id="result-record"></p>
        <button type="button" id="btn-again"><span data-i18n="again">한 판 더</span> <kbd>Enter</kbd></button>
        <button type="button" class="secondary" id="btn-view-board" data-i18n="viewBoard">판 보기</button>
        <button type="button" class="secondary" id="btn-result-menu" data-i18n="changeSettings">설정 바꾸기</button>
      </div>
    </div>

    <div id="toast" role="status"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
